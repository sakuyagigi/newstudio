<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分镜生成面板 - 节奏导演 GAMMA</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');
  
  * {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  
  body {
    background: linear-gradient(135deg, #fef7ed 0%, #fff7ed 50%, #ffedd5 100%);
    min-height: 100vh;
  }
  
  /* 胶片齿孔效果 */
  .film-strip-h {
    background: repeating-linear-gradient(
      90deg,
      #1f2937 0px,
      #1f2937 8px,
      #374151 8px,
      #374151 16px
    );
  }
  
  .film-strip-v {
    background: repeating-linear-gradient(
      0deg,
      #1f2937 0px,
      #1f2937 8px,
      #374151 8px,
      #374151 16px
    );
  }
  
  /* 段落类型颜色 */
  .type-dialogue { border-left: 4px solid #8b5cf6; }
  .type-action { border-left: 4px solid #ef4444; }
  .type-transition { border-left: 4px solid #6b7280; }
  .type-establishing { border-left: 4px solid #10b981; }
  .type-flashback { border-left: 4px solid #f59e0b; }
  
  .type-badge-dialogue { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }
  .type-badge-action { background: linear-gradient(135deg, #ef4444, #dc2626); }
  .type-badge-transition { background: linear-gradient(135deg, #6b7280, #4b5563); }
  .type-badge-establishing { background: linear-gradient(135deg, #10b981, #059669); }
  .type-badge-flashback { background: linear-gradient(135deg, #f59e0b, #d97706); }
  
  /* ABC分级 */
  .grade-a { border: 2px solid #ef4444; }
  .grade-b { border: 2px solid #f97316; }
  .grade-c { border: 2px solid #3b82f6; }
  
  .grade-badge-a { background: linear-gradient(135deg, #ef4444, #dc2626); }
  .grade-badge-b { background: linear-gradient(135deg, #f97316, #ea580c); }
  .grade-badge-c { background: linear-gradient(135deg, #3b82f6, #2563eb); }
  
  /* 三栏布局 */
  .main-layout {
    display: flex;
    gap: 1rem;
    height: calc(100vh - 140px);
    overflow: hidden;
  }
  
  .left-panel {
    width: 220px;
    flex-shrink: 0;
    overflow-y: auto;
  }
  
  .center-panel {
    flex: 1;
    overflow-y: auto;
    min-width: 0;
  }
  
  .right-panel {
    width: 320px;
    flex-shrink: 0;
    overflow-y: auto;
    background: white;
    border-radius: 1rem;
    border: 1px solid #fed7aa;
  }
  
  /* 段落列表项 */
  .paragraph-item {
    padding: 0.75rem 1rem;
    border-radius: 0.75rem;
    cursor: pointer;
    margin-bottom: 0.5rem;
    border-left: 3px solid transparent;
    transition: all 0.2s;
  }
  
  .paragraph-item:hover {
    background: #fff7ed;
  }
  
  .paragraph-item.active {
    background: #fff7ed;
    border-left-color: #f97316;
  }
  
  /* 质检高亮 */
  .qa-error {
    box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.4);
    animation: pulse-error 2s infinite;
  }
  
  .qa-warning {
    box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.4);
  }
  
  .qa-success {
    box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.3);
  }
  
  @keyframes pulse-error {
    0%, 100% { box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.4); }
    50% { box-shadow: 0 0 0 5px rgba(239, 68, 68, 0.2); }
  }
  
  /* 镜头卡片悬停效果 */
  .shot-card {
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  .shot-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
  }
  
  .shot-card.active {
    ring: 3px solid #f97316;
    box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.3);
  }
  
  /* 插入镜头按钮 */
  .shot-insert-btn {
    opacity: 0;
    transition: opacity 0.2s;
  }
  
  .shot-container:hover .shot-insert-btn {
    opacity: 1;
  }
  
  /* 可编辑文本框 */
  [contenteditable="true"]:focus {
    outline: 2px solid #f97316;
    outline-offset: 2px;
    border-radius: 4px;
  }
  
  /* 拖拽样式 */
  .shot-card.dragging {
    opacity: 0.5;
    transform: rotate(3deg);
  }
  
  .drop-zone {
    border: 2px dashed #f97316;
    background: rgba(249, 115, 22, 0.1);
  }
  
  /* 滚动条美化 */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  
  ::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 4px;
  }
  
  ::-webkit-scrollbar-thumb {
    background: #d1d5db;
    border-radius: 4px;
  }
  
  ::-webkit-scrollbar-thumb:hover {
    background: #9ca3af;
  }
  
  /* 折叠动画 */
  .paragraph-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease-out;
  }
  
  .paragraph-content.expanded {
    max-height: 2000px;
  }
  
  /* 锁定标记 */
  .locked-badge {
    position: absolute;
    top: 4px;
    right: 4px;
    background: rgba(0, 0, 0, 0.7);
    color: white;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    display: flex;
    align-items: center;
    gap: 2px;
  }
</style>
</head>
<body class="pb-20">

<!-- 顶部导航 -->
<div class="bg-white/80 backdrop-blur-sm border-b border-orange-200 sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-gradient-to-br from-orange-500 to-red-600 rounded-xl flex items-center justify-center text-white font-bold text-lg">
        Γ
      </div>
      <div>
        <h1 class="text-lg font-bold text-gray-800">分镜生成面板</h1>

      </div>
    </div>
    
    <div class="flex items-center gap-3">

          <option value="9:16">9:16 竖屏</option>
          <option value="1:1">1:1 方形</option>

      </div>
      
      <!-- 模型选择 -->
      <select id="modelSelect" class="px-3 py-1.5 text-sm border border-gray-200 rounded-lg bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-orange-300">

        <option value="nb2">🎨 NB2</option>

        <option value="jimeng-4">✨ 即梦 4.0</option>

    </div>
  </div>
</div>

    <!-- 右栏：镜头详情面板 -->

</div>

<!-- 底部操作栏 -->
<div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-sm border-t border-orange-200 py-3 px-4 z-30">

</div>

<!-- 全局质检弹窗 -->

      </button>
    </div>
  </div>
</div>

// 渲染左侧段落导航
function renderParagraphNav() {
  const container = document.getElementById('paragraphNav');
  container.innerHTML = '';
  
  paragraphs.forEach((p, pIndex) => {
    const typeInfo = paragraphTypes[p.type];
    const totalDuration = p.shots.reduce((sum, s) => sum + parseFloat(s.duration), 0);
    
    const paraEl = document.createElement('div');
    paraEl.className = `paragraph-item ${p.id === currentParagraphId ? 'active' : ''}`;
    
    paraEl.innerHTML = `
      <div class="flex items-center justify-between">
        <div>
          <div class="flex items-center gap-2">
            <span class="text-sm font-medium text-gray-800">${p.name}</span>
            <span class="px-1.5 py-0.5 text-[10px] text-white rounded-full type-badge-${p.type}">${typeInfo.name}</span>
          </div>
          <p class="text-xs text-gray-500 mt-0.5">${p.shots.length}镜 · ${totalDuration.toFixed(0)}s</p>
        </div>
      </div>
    `;
    
    paraEl.onclick = () => selectParagraph(p.id);
    container.appendChild(paraEl);
  });
}

// 选择段落
function selectParagraph(paragraphId) {
  currentParagraphId = paragraphId;
  const paragraph = paragraphs.find(p => p.id === paragraphId);
  if (paragraph && paragraph.shots.length > 0) {
    currentShotId = paragraph.shots[0].id;
  } else {
    currentShotId = null;
  }
  
  renderParagraphNav();
  renderShotList();
  if (currentShotId) {
    renderShotDetail(paragraphId, currentShotId);
  }
}

  if (!currentParagraphId) return;
  addShot(currentParagraphId);
}

// ==================== 交互函数 ====================

function openShotDetail(paragraphId, shotId) {
  currentShotId = shotId;
  renderShotDetail(paragraphId, shotId);
  
  // 高亮当前镜头
  document.querySelectorAll('.shot-card').forEach(card => {
    card.classList.remove('ring-2', 'ring-orange-400');
    if (card.dataset.shotId === shotId) {
      card.classList.add('ring-2', 'ring-orange-400');
    }
  });
}

function updateShotGrade(paragraphId, shotId, newGrade) {
  const paragraph = paragraphs.find(p => p.id === paragraphId);
  const shot = paragraph.shots.find(s => s.id === shotId);
  if (shot) {
    shot.grade = newGrade;
    renderParagraphNav();
    renderShotList();
    renderShotDetail(paragraphId, shotId);
    updateStats();
  }
}

function updateShotField(paragraphId, shotId, field, value) {
  const paragraph = paragraphs.find(p => p.id === paragraphId);
  const shot = paragraph.shots.find(s => s.id === shotId);
  if (shot) {
    shot[field] = value;
    renderParagraphNav();
    renderShotList();
    updateStats();
  }
}

function addShot(paragraphId) {
  const paragraph = paragraphs.find(p => p.id === paragraphId);
  if (paragraph) {
    const newShot = {
      id: `s-${Date.now()}`,
      grade: 'B',
      shotNum: String(paragraph.shots.length + 1).padStart(2, '0'),
      description: '新镜头描述',
      duration: '3s',
      shotType: '中景',
      movement: '固定',
      lines: '',
      locked: false
    };
    paragraph.shots.push(newShot);
    
    currentShotId = newShot.id;
    renderParagraphNav();
    renderShotList();
    renderShotDetail(paragraphId, newShot.id);
    updateStats();
  }
}

function insertShot(paragraphId, targetShotId, position) {
  const paragraph = paragraphs.find(p => p.id === paragraphId);
  const targetIndex = paragraph.shots.findIndex(s => s.id === targetShotId);
  
  if (targetIndex === -1) return;
  
  const insertIndex = position === 'before' ? targetIndex : targetIndex + 1;
  
  const newShot = {
    id: `s-${Date.now()}`,
    grade: 'B',
    shotNum: '00',
    description: '插入的新镜头',
    duration: '2s',
    shotType: '中景',
    movement: '固定',
    lines: '',
    locked: false
  };
  
  paragraph.shots.splice(insertIndex, 0, newShot);
  
  // 重新编号
  paragraph.shots.forEach((s, i) => {
    s.shotNum = String(i + 1).padStart(2, '0');
  });
  
  currentShotId = newShot.id;
  renderParagraphNav();
  renderShotList();
  renderShotDetail(paragraphId, newShot.id);
  updateStats();
}

function deleteShot(paragraphId, shotId) {
  if (!confirm('确定要删除这个镜头吗？')) return;
  
  const paragraph = paragraphs.find(p => p.id === paragraphId);
  const shotIndex = paragraph.shots.findIndex(s => s.id === shotId);
  
  if (shotIndex > -1) {
    paragraph.shots.splice(shotIndex, 1);
    
    // 重新编号
    paragraph.shots.forEach((s, i) => {
      s.shotNum = String(i + 1).padStart(2, '0');
    });
    
    // 选中相邻镜头
    if (paragraph.shots.length > 0) {
      const newIndex = Math.min(shotIndex, paragraph.shots.length - 1);
      currentShotId = paragraph.shots[newIndex].id;
      renderShotDetail(paragraphId, currentShotId);
    } else {
      currentShotId = null;
      document.getElementById('shotDetail').innerHTML = `
        <div class="text-center text-gray-400 py-8">
          点击左侧镜头查看详情
        </div>
      `;
    }
    
    renderParagraphNav();
    renderShotList();
    updateStats();
  }
}

function toggleShotLock(paragraphId, shotId) {
  const paragraph = paragraphs.find(p => p.id === paragraphId);
  const shot = paragraph.shots.find(s => s.id === shotId);
  if (shot) {
    shot.locked = !shot.locked;
    renderShotList();
    renderShotDetail(paragraphId, shotId);
  }
}

// 更新统计信息
function updateStats() {
  const totalParagraphs = paragraphs.length;
  const totalShots = paragraphs.reduce((sum, p) => sum + p.shots.length, 0);
  const totalSeconds = paragraphs.reduce((sum, p) => {
    return sum + p.shots.reduce((s, shot) => s + parseFloat(shot.duration), 0);
  }, 0);
  const gradeACount = paragraphs.reduce((sum, p) => sum + p.shots.filter(s => s.grade === 'A').length, 0);
  
  const mins = Math.floor(totalSeconds / 60);
  const secs = Math.floor(totalSeconds % 60);
  
  document.getElementById('statParagraphs').textContent = totalParagraphs;
  document.getElementById('statShots').textContent = totalShots;
  document.getElementById('statDuration').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
  document.getElementById('statGradeA').textContent = gradeACount;
}

// ==================== 拖拽功能 ====================

let draggedShot = null;
let dragSourceParagraph = null;

function bindDragEvents() {
  document.querySelectorAll('.shot-card').forEach(card => {
    card.addEventListener('dragstart', handleDragStart);
    card.addEventListener('dragend', handleDragEnd);
    card.addEventListener('dragover', handleDragOver);
    card.addEventListener('drop', handleDrop);
    card.addEventListener('dragleave', handleDragLeave);
  });
}

function handleDragStart(e) {
  draggedShot = e.target.dataset.shotId;
  dragSourceParagraph = e.target.dataset.paragraphId;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function handleDragEnd(e) {
  e.target.classList.remove('dragging');
  document.querySelectorAll('.shot-card').forEach(card => {
    card.classList.remove('drop-zone');
  });
  draggedShot = null;
  dragSourceParagraph = null;
}

function handleDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  
  if (e.target.closest('.shot-card')?.dataset.shotId !== draggedShot) {
    e.target.closest('.shot-card')?.classList.add('drop-zone');
  }
}

function handleDragLeave(e) {
  e.target.closest('.shot-card')?.classList.remove('drop-zone');
}

function handleDrop(e) {
  e.preventDefault();
  
  const targetCard = e.target.closest('.shot-card');
  if (!targetCard || targetCard.dataset.shotId === draggedShot) return;
  
  const targetParagraphId = targetCard.dataset.paragraphId;
  const targetShotId = targetCard.dataset.shotId;
  
  // 找到源镜头和目标位置
  const sourcePara = paragraphs.find(p => p.id === dragSourceParagraph);
  const targetPara = paragraphs.find(p => p.id === targetParagraphId);
  
  const sourceIndex = sourcePara.shots.findIndex(s => s.id === draggedShot);
  const targetIndex = targetPara.shots.findIndex(s => s.id === targetShotId);
  
  if (sourceIndex === -1 || targetIndex === -1) return;
  
  // 移除源镜头
  const [movedShot] = sourcePara.shots.splice(sourceIndex, 1);
  
  // 插入到目标位置
  if (dragSourceParagraph === targetParagraphId && sourceIndex < targetIndex) {
    // 同一段落内，源在目标前面，目标索引要减1
    targetPara.shots.splice(targetIndex - 1, 0, movedShot);
  } else {
    targetPara.shots.splice(targetIndex, 0, movedShot);
  }
  
  // 重新编号
  paragraphs.forEach(p => {
    p.shots.forEach((s, i) => {
      s.shotNum = String(i + 1).padStart(2, '0');
    });
  });
  
  // 如果目标段落不是当前段落，切换过去
  if (currentParagraphId !== targetParagraphId) {
    selectParagraph(targetParagraphId);
  } else {
    renderParagraphNav();
    renderShotList();
    if (currentShotId === draggedShot) {
      renderShotDetail(targetParagraphId, draggedShot);
    }
  }
  
  updateStats();
}

let ratioLocked = false;

function toggleRatioLock() {

    uploadTab.classList.add('text-gray-500');

    uploadPanel.classList.add('hidden');
  }
}

// ==================== 全局质检 ====================

document.getElementById('qaBtn').addEventListener('click', runQA);

function runQA() {
  const issues = [];
  const newQaResults = {};
  
  // 遍历所有镜头进行质检
  paragraphs.forEach(p => {
    p.shots.forEach((shot, index) => {
      let status = 'success';
      let shotIssues = [];
      
      // 检查1：时长合理性（太短或太长）
      const duration = parseFloat(shot.duration);
      if (duration < 1) {
        status = 'warning';
        shotIssues.push('镜头时长过短，可能影响观感');
      } else if (duration > 8) {
        status = 'warning';
        shotIssues.push('镜头时长过长，考虑拆分');
      }
      
      // 检查2：台词与时长匹配
      if (shot.lines && shot.lines.length > 20 && duration < 3) {
        status = 'error';
        shotIssues.push('台词过长，时长不足以完成');
      }
      
      // 检查3：正反打轴线（简化检查第2段落）
      if (p.id === 'p2' && shot.shotType === '正反打' && index % 3 === 0) {
        status = 'warning';
        shotIssues.push('可能存在越轴风险，建议确认空间关系');
      }
      
      // 检查4：A类镜头是否有足够时长
      if (shot.grade === 'A' && duration < 2) {
        status = 'warning';
        shotIssues.push('关键镜头时长偏短，建议适当延长');
      }
      
      // 记录结果
      if (status !== 'success') {
        newQaResults[shot.id] = status;
      }
    });
  });
  
  // 计算统计
  const totalShots = paragraphs.reduce((sum, p) => sum + p.shots.length, 0);
  const errorCount = Object.values(newQaResults).filter(s => s === 'error').length;
  const warningCount = Object.values(newQaResults).filter(s => s === 'warning').length;
  const successCount = totalShots - errorCount - warningCount;
  
  // 全局检查项
  // 检查1：整体节奏
  const avgDuration = paragraphs.reduce((sum, p) => {
    return sum + p.shots.reduce((s, shot) => s + parseFloat(shot.duration), 0);
  }, 0) / totalShots;
  
  if (avgDuration < 2) {
    issues.push({
      type: 'warning',
      title: '节奏分析',
      desc: `平均镜头时长${avgDuration.toFixed(1)}秒，节奏偏快，注意观众信息接收`
    });
  } else {
    issues.push({
      type: 'success',
      title: '节奏分析',
      desc: `平均镜头时长${avgDuration.toFixed(1)}秒，节奏适中`
    });
  }
  
  // 检查2：分级合理性
  const gradeACount = paragraphs.reduce((sum, p) => sum + p.shots.filter(s => s.grade === 'A').length, 0);
  const gradeARatio = gradeACount / totalShots;
  
  if (gradeARatio > 0.4) {
    issues.push({
      type: 'warning',
      title: '分级合理性',
      desc: `A类镜头占比${(gradeARatio*100).toFixed(0)}%，略高，建议适当精简核心镜头`
    });
  } else if (gradeARatio < 0.2) {
    issues.push({
      type: 'warning',
      title: '分级合理性',
      desc: `A类镜头占比${(gradeARatio*100).toFixed(0)}%，偏低，核心镜头不够突出`
    });
  } else {
    issues.push({
      type: 'success',
      title: '分级合理性',
      desc: `A类镜头占比${(gradeARatio*100).toFixed(0)}%，分布合理`
    });
  }
  
  // 检查3：问题镜头统计
  if (errorCount > 0) {
    issues.push({
      type: 'error',
      title: '严重问题',
      desc: `发现 ${errorCount} 个严重问题镜头，请查看红色高亮标记`
    });
  }
  if (warningCount > 0) {
    issues.push({
      type: 'warning',
      title: '警告提醒',
      desc: `发现 ${warningCount} 个需要注意的镜头，请查看黄色高亮标记`
    });
  }
  if (errorCount === 0 && warningCount === 0) {
    issues.push({
      type: 'success',
      title: '全部通过',
      desc: '所有镜头质检通过，没有发现明显问题'
    });
  }
  
  // 更新全局结果
  qaResults = newQaResults;
  
  // 重新渲染列表，显示高亮
  renderShotList();
  
  // 渲染质检报告
  const qaContent = document.getElementById('qaContent');
  qaContent.innerHTML = `
    <div class="space-y-3">
      <div class="grid grid-cols-3 gap-2 mb-4">
        <div class="text-center p-3 bg-green-50 rounded-lg">
          <div class="text-xl font-bold text-green-600">${successCount}</div>
          <div class="text-xs text-green-500">正常</div>
        </div>
        <div class="text-center p-3 bg-amber-50 rounded-lg">
          <div class="text-xl font-bold text-amber-600">${warningCount}</div>
          <div class="text-xs text-amber-500">警告</div>
        </div>
        <div class="text-center p-3 bg-red-50 rounded-lg">
          <div class="text-xl font-bold text-red-600">${errorCount}</div>
          <div class="text-xs text-red-500">严重</div>
        </div>
      </div>
      
      ${issues.map(issue => `
        <div class="p-3 rounded-lg ${
          issue.type === 'success' ? 'bg-green-50 border border-green-200' :
          issue.type === 'warning' ? 'bg-amber-50 border border-amber-200' :
          issue.type === 'error' ? 'bg-red-50 border border-red-200' :
          'bg-blue-50 border border-blue-200'
        }">
          <div class="flex items-center gap-2 font-medium text-sm ${
            issue.type === 'success' ? 'text-green-700' :
            issue.type === 'warning' ? 'text-amber-700' :
            issue.type === 'error' ? 'text-red-700' :
            'text-blue-700'
          }">
            <span>${
              issue.type === 'success' ? '✅' : 
              issue.type === 'warning' ? '⚠️' :
              issue.type === 'error' ? '🚨' : 'ℹ️'
            }</span>
            ${issue.title}
          </div>
          <p class="text-xs mt-1 ${
            issue.type === 'success' ? 'text-green-600' :
            issue.type === 'warning' ? 'text-amber-600' :
            issue.type === 'error' ? 'text-red-600' :
            'text-blue-600'
          }">${issue.desc}</p>
        </div>
      `).join('')}
    </div>
    
    <div class="mt-4 p-3 bg-gray-50 rounded-lg">
      <div class="text-xs text-gray-500 text-center">
        GAMMA导演质检系统 v1.0 · 仅作参考，最终以人工确认为准
      </div>
    </div>
  `;
  
  // 显示弹窗
  document.getElementById('qaModal').classList.remove('hidden');
  document.getElementById('qaModal').classList.add('flex');
}

function closeQAModal() {
  document.getElementById('qaModal').classList.add('hidden');
  document.getElementById('qaModal').classList.remove('flex');
}

document.getElementById('qaModal').addEventListener('click', (e) => {
  if (e.target.id === 'qaModal') {

  }
});
