    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        amber: {
                            50: '#FFFBEB',
                            100: '#FEF3C7',
                            200: '#FDE68A',
                            300: '#FCD34D',
                            400: '#FBBF24',
                            500: '#F59E0B',
                            600: '#D97706',
                            700: '#B45309',
                            800: '#92400E',
                            900: '#78350F',
                        },
                        ink: {
                            50: '#F8F6F3',
                            100: '#E8E4DE',
                            200: '#D4CDC3',
                            300: '#B8AEA0',
                            400: '#9A8E7D',
                            500: '#7D7160',
                            600: '#645A4D',
                            700: '#50483E',
                            800: '#3D3730',
                            900: '#2A2621',
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px rgba(0, 0, 0, 0.08)',
                        'card': '0 8px 30px rgba(0, 0, 0, 0.12)',
                        'glow': '0 0 20px rgba(245, 158, 11, 0.3)',
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .scrollbar-thin {
                scrollbar-width: thin;
                scrollbar-color: #D4CDC3 transparent;
            }
            .scrollbar-thin::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }
            .scrollbar-thin::-webkit-scrollbar-track {
                background: transparent;
            }
            .scrollbar-thin::-webkit-scrollbar-thumb {
                background-color: #D4CDC3;
                border-radius: 3px;
            }
            .scrollbar-thin::-webkit-scrollbar-thumb:hover {
                background-color: #B8AEA0;
            }
            .text-gradient-amber {
                background: linear-gradient(135deg, #F59E0B 0%, #F97316 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
            .bg-gradient-amber {
                background: linear-gradient(135deg, #F59E0B 0%, #F97316 100%);
            }
            .card-hover {
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .card-hover:hover {
                transform: translateY(-4px);
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            }
            .version-card-hover {
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .version-card-hover:hover {
                transform: scale(1.05);
                z-index: 10;
            }
            .locked-overlay {
                position: relative;
            }
            .locked-overlay::after {
                content: '';
                position: absolute;
                inset: 0;
                background: rgba(120, 113, 108, 0.6);
                backdrop-filter: blur(2px);
                border-radius: inherit;
            }
            .modal-backdrop {
                background: rgba(0, 0, 0, 0.7);
                backdrop-filter: blur(4px);
            }
        }
    </style>

            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-amber flex items-center justify-center text-white font-bold text-lg">
                    K
                </div>
                <div>
                    <h1 class="text-lg font-bold text-ink-900">角色定妆面板</h1>

                </div>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-sm text-ink-500">项目：<span class="text-ink-700 font-medium">《长安幻夜》</span></span>
                <button class="px-4 py-2 rounded-lg bg-ink-100 text-ink-600 text-sm hover:bg-ink-200 transition-colors">
                    <i class="fa fa-cog mr-1"></i> 设置
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <div class="flex gap-6 h-[calc(100vh-140px)]">
            
            <!-- 左侧：角色列表 (25%) -->
            <aside class="w-1/4 flex flex-col gap-4 min-w-72">
                <!-- 添加角色按钮 -->
                <button class="w-full py-3 rounded-xl border-2 border-dashed border-amber-300 text-amber-600 font-medium hover:bg-amber-50 hover:border-amber-400 transition-all flex items-center justify-center gap-2">
                    <i class="fa fa-plus"></i>
                    添加角色
                </button>

                <!-- 角色列表 -->
                <div class="flex-1 overflow-y-auto scrollbar-thin space-y-3" id="characterList">
                    <!-- 角色卡片由JS渲染 -->
                </div>

                <!-- 底部统计 -->
                <div class="bg-white rounded-xl p-4 shadow-soft border border-ink-100">
                    <h3 class="text-sm font-semibold text-ink-700 mb-3">角色统计</h3>
                    <div class="grid grid-cols-3 gap-2 text-center">
                        <div class="p-2 rounded-lg bg-amber-50">
                            <div class="text-xl font-bold text-amber-600" id="statProtagonist">0</div>
                            <div class="text-xs text-amber-700">主角</div>
                        </div>
                        <div class="p-2 rounded-lg bg-ink-50">
                            <div class="text-xl font-bold text-ink-600" id="statSupporting">0</div>
                            <div class="text-xs text-ink-500">配角</div>
                        </div>
                        <div class="p-2 rounded-lg bg-red-50">
                            <div class="text-xl font-bold text-red-600" id="statAntagonist">0</div>
                            <div class="text-xs text-red-700">反派</div>
                        </div>
                    </div>
                    <div class="mt-3 pt-3 border-t border-ink-100 flex justify-between text-sm">
                        <span class="text-ink-500">总计</span>
                        <span class="font-semibold text-ink-700" id="statTotal">0 个角色</span>
                    </div>
                </div>
            </aside>

            <!-- 右侧：角色详情 (75%) -->
            <section class="flex-1 flex flex-col gap-6 overflow-y-auto scrollbar-thin" id="characterDetail">
                <!-- 详情由JS渲染 -->
            </section>
        </div>
    </main>

    <!-- 大图查看弹窗 -->
    <div id="imageModal" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop">
        <div class="relative max-w-4xl max-h-[90vh] mx-4">
            <button onclick="closeModal()" class="absolute -top-12 right-0 text-white text-2xl hover:text-amber-400 transition-colors">
                <i class="fa fa-times"></i>
            </button>
            <div class="bg-white rounded-2xl shadow-card overflow-hidden">
                <img id="modalImage" src="" alt="定妆照大图" class="max-w-full max-h-[80vh] object-contain">
                <div class="p-4 bg-white border-t border-ink-100">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 id="modalTitle" class="font-semibold text-ink-800"></h3>
                            <p id="modalMeta" class="text-sm text-ink-500"></p>
                        </div>
                        <div class="flex gap-2">

        // ==================== 渲染函数 ====================
        
        function getTypeColor(type) {
            switch(type) {
                case 'protagonist': return 'bg-amber-100 text-amber-700';
                case 'supporting': return 'bg-ink-100 text-ink-600';
                case 'antagonist': return 'bg-red-100 text-red-600';
                default: return 'bg-ink-100 text-ink-600';
            }
        }

        function getStatusStyle(status) {
            switch(status) {
                case 'current': return 'bg-amber-500 text-white';
                case 'draft': return 'bg-ink-100 text-ink-600';
                case 'pending': return 'bg-blue-100 text-blue-600';
                case 'archived': return 'bg-ink-200 text-ink-500';
                default: return 'bg-ink-100 text-ink-600';
            }
        }

        function renderCharacterList() {
            const listEl = document.getElementById('characterList');
            listEl.innerHTML = characters.map(char => `
                <div 
                    class="bg-white rounded-xl p-4 shadow-soft border-2 cursor-pointer card-hover ${
                        selectedCharacterId === char.id 
                            ? 'border-amber-500 shadow-glow' 
                            : 'border-transparent hover:border-ink-200'
                    } ${char.locked ? 'locked-overlay' : ''}"
                    onclick="selectCharacter(${char.id})"
                >
                    <div class="flex items-center gap-3">
                        <div class="relative">
                            <img src="${char.avatar}" alt="${char.name}" 
                                 class="w-14 h-14 rounded-xl object-cover">
                            ${char.locked ? `
                                <div class="absolute inset-0 flex items-center justify-center bg-black/40 rounded-xl z-10">
                                    <i class="fa fa-lock text-white text-lg"></i>
                                </div>
                            ` : ''}
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2">
                                <h3 class="font-semibold text-ink-800 truncate">${char.name}</h3>
                                <span class="px-2 py-0.5 rounded-full text-xs font-medium ${getTypeColor(char.type)}">
                                    ${char.typeLabel}
                                </span>
                            </div>
                            <p class="text-sm text-ink-500 mt-1">
                                ${char.versions.length} 个版本 · 最新 ${char.versions[0].version}
                            </p>
                        </div>
                    </div>
                </div>
            `).join('');

            // 更新统计
            updateStats();
        }

        function updateStats() {
            const protagonist = characters.filter(c => c.type === 'protagonist').length;
            const supporting = characters.filter(c => c.type === 'supporting').length;
            const antagonist = characters.filter(c => c.type === 'antagonist').length;
            
            document.getElementById('statProtagonist').textContent = protagonist;
            document.getElementById('statSupporting').textContent = supporting;
            document.getElementById('statAntagonist').textContent = antagonist;
            document.getElementById('statTotal').textContent = characters.length + ' 个角色';
        }

                                    <img src="${version.thumbnail}" alt="${version.version}"

                                            <i class="fa fa-star mr-1"></i> 当前
                                        </div>
                                    ` : ''}
                                    <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent p-3">
                                        <div class="text-white font-medium">${version.version}</div>
                                        <div class="text-white/70 text-xs">${version.model}</div>
                                    </div>
                                </div>
                                <div class="mt-2 flex justify-between items-center">
                                    <span class="text-xs text-ink-500">${version.createdAt}</span>
                                    <span class="px-2 py-0.5 rounded-full text-xs font-medium ${getStatusStyle(version.status)}">
                                        ${version.statusLabel}
                                    </span>
                                </div>
                            </div>
                        `).join('')}
                        
                        <!-- 添加版本卡片 -->
                        <div class="flex-shrink-0 w-48 flex items-center justify-center">
                            <div class="w-full h-64 rounded-xl border-2 border-dashed border-ink-200 flex flex-col items-center justify-center text-ink-400 hover:border-amber-400 hover:text-amber-500 cursor-pointer transition-colors">
                                <i class="fa fa-plus text-2xl mb-2"></i>
                                <span class="text-sm">生成新版本</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 视觉DNA & 铁律禁令 -->
                <div class="grid grid-cols-2 gap-6">
                    <!-- 视觉DNA -->
                    <div class="bg-white rounded-2xl shadow-soft p-6">
                        <h3 class="text-lg font-semibold text-ink-800 mb-4">
                            <i class="fa fa-dna text-amber-500 mr-2"></i>
                            视觉 DNA
                        </h3>
                        <div class="space-y-4">
                            <div>
                                <h4 class="text-sm font-medium text-ink-600 mb-2 flex items-center">
                                    <span class="w-2 h-2 rounded-full bg-amber-400 mr-2"></span>
                                    发型
                                </h4>
                                <div class="flex flex-wrap gap-2">
                                    ${char.visualDNA.hairstyle.map(tag => `
                                        <span class="px-3 py-1.5 rounded-lg bg-amber-50 text-amber-700 text-sm border border-amber-100">
                                            ${tag}
                                        </span>
                                    `).join('')}
                                </div>
                            </div>
                            <div>
                                <h4 class="text-sm font-medium text-ink-600 mb-2 flex items-center">
                                    <span class="w-2 h-2 rounded-full bg-orange-400 mr-2"></span>
                                    服装
                                </h4>
                                <div class="flex flex-wrap gap-2">
                                    ${char.visualDNA.clothing.map(tag => `
                                        <span class="px-3 py-1.5 rounded-lg bg-orange-50 text-orange-700 text-sm border border-orange-100">
                                            ${tag}
                                        </span>
                                    `).join('')}
                                </div>
                            </div>
                            <div>
                                <h4 class="text-sm font-medium text-ink-600 mb-2 flex items-center">
                                    <span class="w-2 h-2 rounded-full bg-yellow-400 mr-2"></span>
                                    配色
                                </h4>
                                <div class="flex flex-wrap gap-2">
                                    ${char.visualDNA.color.map(tag => `
                                        <span class="px-3 py-1.5 rounded-lg bg-yellow-50 text-yellow-700 text-sm border border-yellow-100">
                                            ${tag}
                                        </span>
                                    `).join('')}
                                </div>
                            </div>
                            <div>
                                <h4 class="text-sm font-medium text-ink-600 mb-2 flex items-center">
                                    <span class="w-2 h-2 rounded-full bg-red-400 mr-2"></span>
                                    气质
                                </h4>
                                <div class="flex flex-wrap gap-2">
                                    ${char.visualDNA.temperament.map(tag => `
                                        <span class="px-3 py-1.5 rounded-lg bg-red-50 text-red-700 text-sm border border-red-100">
                                            ${tag}
                                        </span>
                                    `).join('')}
                                </div>
                            </div>
                            <div>
                                <h4 class="text-sm font-medium text-ink-600 mb-2 flex items-center">
                                    <span class="w-2 h-2 rounded-full bg-purple-400 mr-2"></span>
                                    年代感
                                </h4>
                                <div class="flex flex-wrap gap-2">
                                    ${char.visualDNA.era.map(tag => `
                                        <span class="px-3 py-1.5 rounded-lg bg-purple-50 text-purple-700 text-sm border border-purple-100">
                                            ${tag}
                                        </span>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 铁律禁令 -->
                    <div class="bg-white rounded-2xl shadow-soft p-6">
                        <h3 class="text-lg font-semibold text-ink-800 mb-4">
                            <i class="fa fa-ban text-red-500 mr-2"></i>
                            铁律禁令
                        </h3>
                        <p class="text-sm text-ink-500 mb-4">以下特征禁止在该角色形象中出现</p>
                        <div class="flex flex-wrap gap-3">
                            ${char.forbidden.map(item => `
                                <span class="px-4 py-2 rounded-lg bg-red-50 text-red-600 text-sm border border-red-200 flex items-center gap-2">
                                    <i class="fa fa-times-circle text-red-400"></i>
                                    ${item}
                                </span>
                            `).join('')}
                        </div>
                        
                        <div class="mt-6 pt-6 border-t border-ink-100">
                            <h4 class="text-sm font-medium text-ink-700 mb-3">禁令说明</h4>
                            <ul class="text-sm text-ink-500 space-y-2">
                                <li class="flex items-start gap-2">
                                    <i class="fa fa-info-circle text-amber-500 mt-0.5"></i>
                                    <span>所有生成的定妆照将自动检测以上禁止特征</span>
                                </li>
                                <li class="flex items-start gap-2">
                                    <i class="fa fa-info-circle text-amber-500 mt-0.5"></i>
                                    <span>违反禁令的版本将被标记并提示重新生成</span>
                                </li>
                                <li class="flex items-start gap-2">
                                    <i class="fa fa-info-circle text-amber-500 mt-0.5"></i>
                                    <span>锁定角色后，禁令规则不可修改</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- 操作区 -->
                <div class="bg-white rounded-2xl shadow-soft p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <h3 class="text-lg font-semibold text-ink-800">操作面板</h3>
                            <p class="text-sm text-ink-500 mt-1">管理角色定妆，生成新的版本</p>
                        </div>
                        <div class="flex gap-3">
                            <button class="px-5 py-2.5 rounded-xl border border-ink-200 text-ink-600 font-medium hover:bg-ink-50 transition-colors flex items-center gap-2">
                                <i class="fa fa-upload"></i>
                                上传参考图
                            </button>
                            <button class="px-5 py-2.5 rounded-xl border border-ink-200 text-ink-600 font-medium hover:bg-ink-50 transition-colors flex items-center gap-2">
                                <i class="fa ${char.locked ? 'fa-unlock' : 'fa-lock'}"></i>
                                ${char.locked ? '解锁角色' : '锁定角色'}
                            </button>
                            <button class="px-6 py-2.5 rounded-xl bg-gradient-amber text-white font-medium hover:opacity-90 transition-opacity shadow-lg shadow-amber-200 flex items-center gap-2">
                                <i class="fa fa-magic"></i>
                                生成新定妆
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ==================== 交互函数 ====================
        
        function selectCharacter(id) {
            selectedCharacterId = id;
            renderCharacterList();
            renderCharacterDetail();
        }

        function openModal(imageSrc, title, meta) {
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            const modalTitle = document.getElementById('modalTitle');
            const modalMeta = document.getElementById('modalMeta');
            
            modalImage.src = imageSrc;
            modalTitle.textContent = title;
            modalMeta.textContent = meta;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.style.overflow = '';
        }

        // 点击背景关闭弹窗
        document.getElementById('imageModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // ESC 键关闭弹窗
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', function() {
            renderCharacterList();
            renderCharacterDetail();
        });
    </script>
</body>
</html>
