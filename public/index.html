<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: {
              primary: '#1a1613',
              secondary: '#26201c',
              tertiary: '#2e2620',
              card: '#2a231e',
            },
            border: {
              DEFAULT: '#3d332c',
              light: '#4a3d34',
            },
            text: {
              primary: '#f5f0eb',
              secondary: '#b8a99c',
              tertiary: '#8b7d6f',
              muted: '#66594f',
            },
            accent: {
              orange: {
                50: '#fff7ed',
                100: '#ffedd5',
                200: '#fed7aa',
                300: '#fdba74',
                400: '#fb923c',
                500: '#f97316',
                600: '#ea580c',
                700: '#c2410c',
              },
              amber: {
                50: '#fffbeb',
                100: '#fef3c7',
                400: '#fbbf24',
                500: '#f59e0b',
                600: '#d97706',
              },
              green: {
                50: '#f0fdf4',
                400: '#4ade80',
                500: '#22c55e',
                600: '#16a34a',
              },
              red: {
                50: '#fef2f2',
                400: '#f87171',
                500: '#ef4444',
                600: '#dc2626',
              },
              purple: {
                50: '#faf5ff',
                400: '#c084fc',
                500: '#a855f7',
                600: '#9333ea',
              },
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          boxShadow: {
            'glow-orange': '0 0 20px rgba(249, 115, 22, 0.2)',
            'card': '0 2px 8px rgba(0, 0, 0, 0.3)',
            'card-hover': '0 8px 24px rgba(0, 0, 0, 0.4)',
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      -webkit-font-smoothing: antialiased;
      background: #1a1613;
      color: #f5f0eb;
    }
    
    .scrollbar-thin::-webkit-scrollbar { width: 6px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #4a3d34; border-radius: 3px; }
    .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: #5d4e42; }
    
    .fade-in { animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .card {
      background: #2a231e;
      border: 1px solid #3d332c;
      border-radius: 14px;
      transition: all 0.25s ease;
    }
    .card:hover {
      border-color: #5d4e42;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: white;
      transition: all 0.2s ease;
      border-radius: 10px;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #fb923c 0%, #f97316 100%);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
    }
    
    .btn-secondary {
      background: #2e2620;
      border: 1px solid #4a3d34;
      color: #b8a99c;
      transition: all 0.2s ease;
      border-radius: 10px;
    }
    .btn-secondary:hover {
      border-color: #f97316;
      color: #f97316;
      background: rgba(249, 115, 22, 0.1);
    }
    
    .btn-ghost {
      color: #8b7d6f;
      transition: all 0.2s ease;
      border-radius: 8px;
    }
    .btn-ghost:hover {
      color: #f97316;
      background: rgba(249, 115, 22, 0.1);
    }
    
    .nav-item {
      transition: all 0.2s ease;
      border-radius: 10px;
      position: relative;
    }
    .nav-item:hover {
      background: #2e2620;
      color: #f5f0eb;
    }
    .nav-item.active {
      background: rgba(249, 115, 22, 0.15);
      color: #f97316;
      font-weight: 500;
    }
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 20px;
      background: #f97316;
      border-radius: 0 3px 3px 0;
    }
    
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 500;
      border-radius: 9999px;
    }
    .tag-orange { background: rgba(249, 115, 22, 0.15); color: #fb923c; }
    .tag-green { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
    .tag-red { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .tag-amber { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .tag-purple { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
    .tag-neutral { background: #3d332c; color: #b8a99c; }
    .tag-blue { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    
    .progress-bar {
      background: #3d332c;
      border-radius: 9999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #f97316, #fb923c);
      border-radius: 9999px;
      transition: width 0.3s ease;
    }
    
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #f5f0eb;
      margin-bottom: 12px;
    }
    
    .divider {
      height: 1px;
      background: #3d332c;
      margin: 14px 0;
    }
    
    .sidebar-panel {
      background: #26201c;
      border: 1px solid #3d332c;
      border-radius: 12px;
      overflow: hidden;
    }
    
    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid #3d332c;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #2a231e;
    }
    
    .sidebar-header h4 {
      font-size: 13px;
      font-weight: 600;
      color: #f5f0eb;
    }
    
    .list-item {
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.15s ease;
      border-bottom: 1px solid #332a24;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item:hover {
      background: #2e2620;
    }
    .list-item.active {
      background: rgba(249, 115, 22, 0.1);
      border-left: 3px solid #f97316;
      padding-left: 13px;
    }
    
    .step-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .step-item {
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
      color: #8b7d6f;
      background: #2e2620;
      transition: all 0.2s ease;
    }
    .step-item.active {
      background: rgba(249, 115, 22, 0.2);
      color: #fb923c;
    }
    .step-item.completed {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }
    .step-arrow {
      color: #4a3d34;
      font-size: 12px;
    }
    
    .input-field {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #3d332c;
      border-radius: 10px;
      font-size: 13px;
      transition: all 0.2s ease;
      background: #2e2620;
      color: #f5f0eb;
    }
    .input-field:focus {
      outline: none;
      border-color: #f97316;
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1);
    }
    .input-field::placeholder {
      color: #66594f;
    }
    
    textarea.input-field {
      resize: none;
      line-height: 1.6;
    }
    
    .stat-card {
      text-align: center;
      padding: 16px;
      background: #2e2620;
      border-radius: 10px;
      border: 1px solid #3d332c;
    }
    .stat-number {
      font-size: 22px;
      font-weight: 700;
      color: #f5f0eb;
      line-height: 1.2;
    }
    .stat-label {
      font-size: 11px;
      color: #8b7d6f;
      margin-top: 4px;
    }
    
    .score-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .score-bar .label {
      width: 60px;
      font-size: 11px;
      color: #8b7d6f;
      font-weight: 500;
    }
    .score-bar .bar {
      flex: 1;
      height: 6px;
      background: #3d332c;
      border-radius: 3px;
      overflow: hidden;
    }
    .score-bar .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #f97316, #fb923c);
      border-radius: 3px;
    }
    .score-bar .score {
      width: 30px;
      text-align: right;
      font-size: 12px;
      font-weight: 600;
      color: #f5f0eb;
    }
    
    /* 页面切换动画 */
    .page-content {
      animation: fadeIn 0.3s ease;
    }
    
    /* 胶囊按钮组 */
    .capsule-group {
      display: inline-flex;
      background: #2e2620;
      border-radius: 9999px;
      padding: 3px;
      border: 1px solid #3d332c;
    }
    .capsule-btn {
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      color: #8b7d6f;
      transition: all 0.2s ease;
      background: transparent;
      border: none;
      cursor: pointer;
    }
    .capsule-btn.active {
      background: #f97316;
      color: white;
    }
    .capsule-btn:hover:not(.active) {
      color: #b8a99c;
    }
    
    /* 顶部导航栏 */
    .top-header {
      background: rgba(26, 22, 19, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #3d332c;
    }
    
    /* 侧边栏 */
    .sidebar {
      background: #1a1613;
      border-right: 1px solid #3d332c;
    }
    
    /* 渐变文字 */
    .gradient-text {
      background: linear-gradient(135deg, #f97316, #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    /* 玻璃态卡片 */
    .glass-card {
      background: rgba(42, 35, 30, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(61, 51, 44, 0.6);
    }
    
    /* 脉冲动画 */
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .pulse-dot {
      animation: pulse-dot 2s ease-in-out infinite;
    }
  </style>
</head>

  <script>
    // ========= 全局状态 =========
    const state = {
      currentPage: 'dashboard',
      script: '',
      pipelineResult: null,
      characterChainResult: null,
      sceneChainResult: null,
      storyboardResult: null,
      runningTasks: {},
      selectedStyles: [],
      customStyles: {},
      currentShotIndex: 0,
      currentParaIndex: 0,
      // 项目管理
      projects: [],
      currentProject: null,
      episodes: [],
      currentEpisode: null,
      autoSaveTimer: null,
      isSaving: false,
    }
    
    const directorColors = {
      alpha: { bg: 'bg-blue-500/10', text: 'text-blue-400', border: 'border-blue-500/30' },
      beta: { bg: 'bg-purple-500/10', text: 'text-purple-400', border: 'border-purple-500/30' },
      gamma: { bg: 'bg-green-500/10', text: 'text-green-400', border: 'border-green-500/30' },
      kappa: { bg: 'bg-pink-500/10', text: 'text-pink-400', border: 'border-pink-500/30' },
      epsilon: { bg: 'bg-amber-500/10', text: 'text-amber-400', border: 'border-amber-500/30' },
    }
    
    const pageTitles = {
      dashboard: { title: '项目总览', subtitle: '从剧本到分镜的全流程AI制片' },
      script: { title: '剧本分析', subtitle: '五导演联合深度拆解 · 全维度剧本分析' },
      character: { title: '角色定妆', subtitle: 'KAPPA导演工作室 · 角色视觉一致性锚定' },
      storyboard: { title: '分镜生成', subtitle: 'GAMMA节奏导演 · 镜头语言设计工作台' },
      cost: { title: '成本中心', subtitle: '用量统计 · 成本明细 · 套餐方案' },
    }
    
    // ========= 工具函数 =========
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container')
      const toast = document.createElement('div')
      const styles = {
        info: 'bg-bg-card border border-border text-text-primary shadow-xl',
        success: 'bg-green-500/10 border border-green-500/30 text-green-400 shadow-xl',
        error: 'bg-red-500/10 border border-red-500/30 text-red-400 shadow-xl',
        warning: 'bg-amber-500/10 border border-amber-500/30 text-amber-400 shadow-xl',
      }
      toast.className = `${styles[type]} px-4 py-3 rounded-xl text-sm fade-in backdrop-blur`
      toast.textContent = message
      container.appendChild(toast)
      setTimeout(() => toast.remove(), 3000)
    }
    
    function formatCost(cost) {
      if (cost === undefined || cost === null) return '¥0.00'
      return `¥${parseFloat(cost).toFixed(2)}`
    }
    
    function openImageModal(src) {
      document.getElementById('modal-image').src = src
      document.getElementById('image-modal').classList.remove('hidden')
      document.getElementById('image-modal').classList.add('flex')
    }
    
    function closeImageModal() {
      document.getElementById('image-modal').classList.add('hidden')
      document.getElementById('image-modal').classList.remove('flex')
    }

    // ========= 弹窗组件 =========
    function openModal(title, bodyHtml, footerHtml) {
      document.getElementById('modal-title').textContent = title
      document.getElementById('modal-body').innerHTML = bodyHtml
      document.getElementById('modal-footer').innerHTML = footerHtml
      document.getElementById('app-modal').classList.remove('hidden')
      document.getElementById('app-modal').classList.add('flex')
    }

    function closeModal() {
      document.getElementById('app-modal').classList.add('hidden')
      document.getElementById('app-modal').classList.remove('flex')
    }

    function showPrompt(title, placeholder, defaultValue = '') {
      return new Promise((resolve) => {
        const bodyHtml = `
          <input type="text" id="prompt-input" placeholder="${placeholder}" 
            class="input-field w-full px-4 py-3 text-sm"
            value="${defaultValue}">
        `
        const footerHtml = `
          <button onclick="closeModal(); window.__promptResolve(null)" class="btn-secondary px-4 py-2 text-sm">取消</button>
          <button onclick="const v = document.getElementById('prompt-input').value.trim(); closeModal(); window.__promptResolve(v || null)" class="btn-primary px-4 py-2 text-sm">确定</button>
        `
        window.__promptResolve = resolve
        openModal(title, bodyHtml, footerHtml)
        setTimeout(() => {
          const input = document.getElementById('prompt-input')
          if (input) input.focus()
        }, 50)
      })
    }

    function showConfirm(title, message) {
      return new Promise((resolve) => {
        const bodyHtml = `<p class="text-text-secondary text-sm">${message}</p>`
        const footerHtml = `
          <button onclick="closeModal(); window.__confirmResolve(false)" class="btn-secondary px-4 py-2 text-sm">取消</button>
          <button onclick="closeModal(); window.__confirmResolve(true)" class="btn-primary px-4 py-2 text-sm">确定</button>
        `
        window.__confirmResolve = resolve
        openModal(title, bodyHtml, footerHtml)
      })
    }
    
    async function apiCall(endpoint, method = 'GET', body = null) {
      try {
        const options = { method, headers: { 'Content-Type': 'application/json' } }
        if (body) options.body = JSON.stringify(body)
        const res = await fetch(endpoint, options)
        return await res.json()
      } catch (e) {
        return { success: false, error: e.message }
      }
    }
    
    function pollTask(taskId, onProgress, onComplete, onError) {
      const poll = async () => {
        const result = await apiCall(`/api/image/status/${taskId}`)
        if (!result.success) {
          onError && onError(result.error || '查询失败')
          return
        }
        const data = result.data
        onProgress && onProgress(data)
        if (data.status === 'completed') {
          onComplete && onComplete(data.result)
          delete state.runningTasks[taskId]
        } else if (data.status === 'failed') {
          onError && onError(data.error || '任务失败')
          delete state.runningTasks[taskId]
        } else {
          state.runningTasks[taskId] = data
          setTimeout(poll, 3000)
        }
      }
      poll()
    }
    
    // ========= 项目管理 =========
    async function loadProjects() {
      const res = await apiCall('/api/projects')
      if (res.success) {
        state.projects = res.projects
      }
      return res
    }
    
    async function createProject(name, description = '') {
      const res = await apiCall('/api/projects', 'POST', { name, description })
      if (res.success) {
        state.projects.unshift(res.project)
      }
      return res
    }
    
    async function selectProject(projectId) {
      const res = await apiCall(`/api/projects/${projectId}`)
      if (res.success) {
        state.currentProject = res.project
        state.episodes = res.episodes || []
        if (state.episodes.length > 0) {
          state.currentEpisode = state.episodes[0]
          await loadEpisodeData(state.currentEpisode.id)
        } else {
          state.script = ''
          state.pipelineResult = null
          state.characterChainResult = null
          state.sceneChainResult = null
          state.storyboardResult = null
        }
      }
      return res
    }
    
    async function loadEpisodeData(episodeId) {
      if (!state.currentProject) return { success: false, error: '未选择项目' }
      const res = await apiCall(`/api/projects/${state.currentProject.id}/episodes/${episodeId}`)
      if (res.success) {
        state.currentEpisode = res.episode
        state.script = res.episode.script || ''
        state.pipelineResult = res.episode.pipeline_result || null
        state.characterChainResult = res.episode.character_chain_result || null
        state.sceneChainResult = res.episode.scene_chain_result || null
        state.storyboardResult = res.episode.storyboard_result || null
      }
      return res
    }
    
    async function createEpisode(projectId, name, script = '') {
      const res = await apiCall(`/api/projects/${projectId}/episodes`, 'POST', { title: name, script })
      if (res.success) {
        state.episodes.push(res.episode)
      }
      return res
    }
    
    async function saveScript() {
      if (!state.currentEpisode || !state.currentProject) return
      state.isSaving = true
      const res = await apiCall(`/api/projects/${state.currentProject.id}/episodes/${state.currentEpisode.id}`, 'PUT', {
        script: state.script
      })
      state.isSaving = false
      return res
    }
    
    async function saveEpisodeData(data) {
      if (!state.currentEpisode || !state.currentProject) return
      const res = await apiCall(`/api/projects/${state.currentProject.id}/episodes/${state.currentEpisode.id}`, 'PUT', data)
      return res
    }
    
    function autoSaveScript() {
      if (!state.currentEpisode) return
      if (state.autoSaveTimer) clearTimeout(state.autoSaveTimer)
      state.autoSaveTimer = setTimeout(() => {
        saveScript()
        updateSaveStatus()
      }, 2000)
    }
    
    function updateSaveStatus() {
      const el = document.getElementById('save-status')
      if (!el) return
      if (state.isSaving) {
        el.textContent = '保存中...'
        el.className = 'text-xs text-text-tertiary'
      } else {
        el.textContent = '已自动保存'
        el.className = 'text-xs text-green-400'
      }
    }
    
    async function uploadScriptFile(file) {
      const formData = new FormData()
      formData.append('file', file)
      try {
        const res = await fetch('/api/script/upload', {
          method: 'POST',
          body: formData
        })
        return await res.json()
      } catch (e) {
        return { success: false, error: e.message }
      }
    }
    
    async function autoSplitEpisodes(projectId, script) {
      const res = await apiCall(`/api/projects/${projectId}/episodes/auto-split`, 'POST', { script })
      if (res.success) {
        state.episodes = res.episodes
        if (state.episodes.length > 0) {
          await selectEpisode(state.episodes[0].id)
        }
      }
      return res
    }
    
    async function selectEpisode(episodeId) {
      // 先保存当前剧本
      if (state.currentEpisode && state.script) {

      }
      return await loadEpisodeData(episodeId)

    function switchDirectorTab(director) {
      document.querySelectorAll('.director-tab').forEach(tab => {
        if (tab.dataset.director === director) {
          tab.classList.add('text-orange-400', 'bg-bg-card')
          tab.classList.remove('text-text-tertiary')
          tab.style.borderBottom = '2px solid #f97316'
        } else {
          tab.classList.remove('text-orange-400', 'bg-bg-card')
          tab.classList.add('text-text-tertiary')
          tab.style.borderBottom = '2px solid transparent'
        }
      })
      
      const content = document.getElementById('director-content')
      content.innerHTML = renderDirectorAnalysis(director)
    }
    
    function renderDirectorAnalysis(director) {
      const result = state.pipelineResult?.results?.[director]
      
      if (!result) return renderEmptyAnalysis()
      
      if (result.error) {
        return `
          <div class="text-center py-16">
            <div class="text-3xl mb-3">❌</div>
            <p class="text-sm text-red-400">分析失败</p>
            <p class="text-xs text-text-tertiary mt-2">${result.error}</p>
          </div>
        `
      }
      
      const data = result.data?.content || result.data || {}
      
      switch(director) {
        case 'alpha': return renderAlphaAnalysis(data)
        case 'beta': return renderBetaAnalysis(data)
        case 'gamma': return renderGammaAnalysis(data)
        case 'kappa': return renderKappaAnalysis(data)
        case 'epsilon': return renderEpsilonAnalysis(data)
        default:
          return `<pre class="text-xs text-text-secondary overflow-auto">${JSON.stringify(data, null, 2)}</pre>`
      }
    }

    function updateUploadProgress(percent, text) {

    async function handleScriptFileUpload(event) {
      const file = event.target.files[0]
      if (!file) return
      
      if (!state.currentProject) {
        showToast('请先创建或选择一个项目', 'warning')
        return
      }
      
      const formData = new FormData()
      formData.append('file', file)
      
      // 显示上传中状态
      const input = document.getElementById('script-input')
      if (input && input.parentElement) {
        input.style.opacity = '0.3'
      }
      showUploadProgress(true)
      updateUploadProgress(0, '上传中...')
      
      const xhr = new XMLHttpRequest()
      
      xhr.upload.onprogress = function(e) {
        if (e.lengthComputable) {
          const percent = (e.loaded / e.total) * 90
          updateUploadProgress(percent, '上传中...')
        }
      }
      
      xhr.onload = function() {
        try {
          const data = JSON.parse(xhr.responseText)
          
          if (data.success) {
            updateUploadProgress(100, '解析完成')
            state.script = data.data.content
            if (input) {
              input.value = data.data.content
              input.style.opacity = '1'
            }
            updateScriptStats()
            showToast('✅ 文件上传成功，共 ' + data.data.char_count + ' 字', 'success')
            
            // 自动保存
            if (state.currentEpisode) {
              saveScript().then(() => updateSaveStatus())
            }
            
            setTimeout(() => showUploadProgress(false), 800)
          } else {
            if (input) input.style.opacity = '1'
            showUploadProgress(false)
            showToast('上传失败: ' + (data.error || '未知错误'), 'error')
          }
        } catch (e) {
          if (input) input.style.opacity = '1'
          showUploadProgress(false)
          showToast('上传失败: ' + e.message, 'error')
        }
      }
      
      xhr.onerror = function() {
        if (input) input.style.opacity = '1'
        showUploadProgress(false)
        showToast('上传失败: 网络错误', 'error')
      }
      
      xhr.open('POST', '/api/script/upload')
      xhr.send(formData)
      
      // 上传完成后进入后端解析阶段，进度条缓慢增长
      let parsePercent = 90
      let parseTimer = null
      
      const startParseProgress = () => {
        updateUploadProgress(parsePercent, '解析中...')
        parseTimer = setInterval(() => {
          if (parsePercent < 98) {
            parsePercent += 0.5
            updateUploadProgress(parsePercent, '解析中...')
          }
        }, 400)
      }
      
      // 500ms后如果还没完成，开始显示解析进度动画
      setTimeout(() => {
        const bar = document.getElementById('upload-progress-bar')
        if (bar) {
          const current = parseFloat(bar.style.width)
          if (current < 95) {
            parsePercent = Math.max(90, current)
            startParseProgress()
          }
        }
      }, 500)
      
      // 请求完成后清除定时器
      const originalOnload = xhr.onload
      const originalOnerror = xhr.onerror
      
      xhr.onload = function() {
        if (parseTimer) clearInterval(parseTimer)
        originalOnload.call(this)
      }
      
      xhr.onerror = function() {
        if (parseTimer) clearInterval(parseTimer)
        if (originalOnerror) originalOnerror.call(this)
      }
      
      event.target.value = ''
    }

    async function runPipeline() {
      const script = document.getElementById('script-input')?.value
      if (!script || script.trim().length < 10) {
        showToast('请输入至少10字的剧本内容', 'warning')
        return
      }
      
      const tierSelect = document.getElementById('tier-select') || document.getElementById('tier-select-bottom')
      const tier = tierSelect?.value || 'standard'
      state.script = script
      
      // 显示加载状态
      const content = document.getElementById('director-content')
      content.innerHTML = `
        <div class="text-center py-20">
          <div class="relative w-24 h-24 mx-auto mb-6">
            <div class="absolute inset-0 rounded-full border-4 border-orange-500/20"></div>

            <div class="absolute inset-2 rounded-full border-4 border-transparent border-t-amber-400 animate-spin" style="animation-duration: 1.5s; animation-direction: reverse;"></div>
            <div class="absolute inset-0 flex items-center justify-center">
              <span class="text-2xl">🎬</span>
            </div>
          </div>
          <p class="text-lg font-semibold text-text-primary mb-2" id="analysis-status">正在分析剧本...</p>
          <p class="text-sm text-text-tertiary mb-6" id="analysis-substatus">五导演联合审片中，请稍候</p>
          <div class="w-64 mx-auto">
            <div class="h-1.5 bg-bg-tertiary rounded-full overflow-hidden">
              <div id="analysis-progress" class="h-full bg-gradient-to-r from-orange-500 to-amber-400 rounded-full transition-all duration-500" style="width: 10%"></div>
            </div>
            <p class="text-xs text-text-muted mt-2" id="analysis-percent">10%</p>
          </div>
        </div>
      `
      
      // 模拟进度更新
      const progressTimers = []
      const steps = [
        { percent: 25, status: '正在分析剧本结构...', substatus: '识别场景、角色、对话' },
        { percent: 45, status: 'ALPHA 叙事导演分析中...', substatus: '拆解故事弧线与节奏点' },
        { percent: 60, status: 'BETA 视觉导演分析中...', substatus: '提取场景描述与视觉参考' },
        { percent: 75, status: 'GAMMA 节奏导演分析中...', substatus: '设计镜头语言与分镜结构' },
        { percent: 88, status: 'KAPPA 角色导演分析中...', substatus: '锚定角色形象一致性' },
        { percent: 95, status: 'EPSILON 制片总结中...', substatus: '整合分析结果与成本核算' },
      ]
      
      let currentStep = 0
      let slowGrowthTimer = null
      
      const updateProgress = (step) => {
        const statusEl = document.getElementById('analysis-status')
        const substatusEl = document.getElementById('analysis-substatus')
        const progressEl = document.getElementById('analysis-progress')
        const percentEl = document.getElementById('analysis-percent')
        if (statusEl) statusEl.textContent = step.status
        if (substatusEl) substatusEl.textContent = step.substatus
        if (progressEl) progressEl.style.width = step.percent + '%'
        if (percentEl) percentEl.textContent = step.percent + '%'
      }
      
      // 分步更新进度
      steps.forEach((step, i) => {
        const timer = setTimeout(() => {
          currentStep = i
          updateProgress(step)
          
          // 最后一步后启动缓慢增长模式
          if (i === steps.length - 1) {
            let slowPercent = step.percent
            let dotCount = 0
            const finalHints = [
              '正在整合五导演分析结果...',
              '正在生成制片总结报告...',
              '正在核算成本与排期...',
              '最后打磨中，马上就好...'
            ]
            let hintIndex = 0
            
            slowGrowthTimer = setInterval(() => {
              if (slowPercent < 99) {
                slowPercent += 0.2
                const progressEl = document.getElementById('analysis-progress')
                const percentEl = document.getElementById('analysis-percent')
                const substatusEl = document.getElementById('analysis-substatus')
                if (progressEl) progressEl.style.width = slowPercent + '%'
                if (percentEl) percentEl.textContent = Math.round(slowPercent) + '%'
                
                // 动态更新子状态，让用户知道还在跑
                dotCount = (dotCount + 1) % 4
                const dots = '.'.repeat(dotCount + 1)
                if (substatusEl && slowPercent > 97) {
                  substatusEl.textContent = finalHints[hintIndex] + dots
                  // 每15次换一个提示
                  if (dotCount === 0) {
                    hintIndex = (hintIndex + 1) % finalHints.length
                  }
                }
              }
            }, 400)
          }
        }, (i + 1) * 1500)
        progressTimers.push(timer)
      })
      
      try {
        const result = await apiCall('/api/directors/pipeline', 'POST', { script, tier, async: false })
        
        // 清除所有定时器
        progressTimers.forEach(t => clearTimeout(t))
        if (slowGrowthTimer) clearInterval(slowGrowthTimer)
        
        if (result.success) {
          state.pipelineResult = result.data
          // 保存分析结果到后端
          saveEpisodeData({
            pipeline_result: result.data
          }).catch(e => console.error('保存分析结果失败:', e))
          renderScriptPage(document.getElementById('page-content'))
          showToast('🎉 分析完成！', 'success')
        } else {
          showToast('分析失败: ' + (result.error || '未知错误'), 'error')
        }
      } catch (e) {
        progressTimers.forEach(t => clearTimeout(t))
        showToast('请求失败，请检查服务是否运行', 'error')
      }
    }

          pollTask(

        } else {

                  scene_chain_result: finalResult
                }).catch(e => console.error('保存场景链失败:', e))
                renderStoryboardPage(document.getElementById('page-content'))
                showToast('场景概念图生成完成！', 'success')
              } else {
                showToast('生成失败', 'error')
              }
            },
            (error) => {
              showToast('生成失败: ' + error, 'error')
            }
          )
        }
      })
    }
    
    function generateStoryboardImages() {
      const gammaData = state.pipelineResult?.results?.gamma?.data?.content
      const shots = gammaData?.shots || []
      
      showToast('分镜生图任务已启动', 'info')
      
      let charRefs = null
      let sceneRefs = null
      if (state.characterChainResult?.all_variants) {
        charRefs = state.characterChainResult.all_variants.slice(0, 2).map(v => v.url)
      }
      if (state.sceneChainResult?.all_variants) {
        sceneRefs = state.sceneChainResult.all_variants.slice(0, 1).map(v => v.url)
      }
      
      apiCall('/api/image/storyboard', 'POST', {
        shots: shots,
        characterReferenceUrls: charRefs,
        sceneReferenceUrls: sceneRefs,
      }).then(result => {
        if (result.success) {
          const taskId = result.taskId
          pollTask(
            taskId,
            (data) => {},
            (finalResult) => {
              state.storyboardResult = finalResult
              // 保存到后端
              saveEpisodeData({
                storyboard_result: finalResult
              }).catch(e => console.error('保存分镜结果失败:', e))
              renderStoryboardPage(document.getElementById('page-content'))
              showToast(`分镜图生成完成！共 ${finalResult?.success_count || 0}/${finalResult?.shots?.length || 0} 张`, 'success')
            },
            (error) => {
              showToast('生成失败: ' + error, 'error')
            }
          )
        } else {
          showToast('启动失败: ' + (result.error || '未知错误'), 'error')
        }
      })
    }
    
    function regenerateCurrentShot() {
      showToast('重新生成当前镜头...', 'info')
    }

    function calculateTotalCost() {
      let total = 0
      if (state.pipelineResult?.totalCost) total += state.pipelineResult.totalCost
      if (state.characterChainResult?.total_cost) total += state.characterChainResult.total_cost
      if (state.sceneChainResult?.total_cost) total += state.sceneChainResult.total_cost
      if (state.storyboardResult?.total_cost) total += state.storyboardResult.total_cost
      return total
    }
    
    // ========= 初始化 =========
    async function initApp() {
      await loadProjects()

    initApp()
